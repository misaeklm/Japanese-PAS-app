<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabin Announcement Player</title>
    <style>
        :root {
            --primary-color: #003366;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: var(--primary-color); font-size: 24px; margin-bottom: 10px; text-align: center; }
        .subtitle { font-size: 14px; color: #666; margin-bottom: 20px; text-align: center; }
        .container { width: 100%; max-width: 500px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 15px; box-sizing: border-box; }
        .audio-group { margin-bottom: 15px; }
        .group-title { font-size: 16px; font-weight: bold; color: var(--primary-color); border-left: 4px solid var(--primary-color); padding-left: 8px; margin-bottom: 10px; }
        .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
        .play-btn { background-color: #e6f0fa; color: var(--primary-color); border: 2px solid var(--primary-color); border-radius: 8px; padding: 12px 10px; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.2s ease; text-align: center; outline: none; -webkit-tap-highlight-color: transparent; }
        .play-btn:active { background-color: var(--primary-color); color: white; transform: scale(0.98); }
        .play-btn.playing { background-color: #ff9900; border-color: #ff9900; color: white; }
        .controls { margin-top: 20px; width: 100%; max-width: 500px; }
        .stop-btn { background-color: #cc0000; color: white; border: none; border-radius: 8px; padding: 12px 30px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .stop-btn:active { background-color: #990000; }
    </style>
</head>
<body>

    <h1>✈️ Cabin Announcement Player</h1>
    <div class="subtitle">Offline Ready</div>

    <div class="container">
        <!-- Pre-Take-Off -->
        <div class="audio-group">
            <div class="group-title">Pre-Take-Off</div>
            <div class="btn-grid">
                <button class="play-btn" onclick="playAudio('Audio1.mp3', this)">Fuel Speech</button>
                <button class="play-btn" onclick="playAudio('Audio2.mp3', this)">Hand Baggage</button>
                <button class="play-btn" onclick="playAudio('Audio3.mp3', this)">Help With Closing Overhead Bins</button>
                <button class="play-btn" onclick="playAudio('Audio4.mp3', this)">Powerbanks</button>
                <button class="play-btn" onclick="playAudio('Audio5.mp3', this)">Weight & Balance</button>
                <button class="play-btn" onclick="playAudio('Audio6.mp3', this)">Welcome</button>
                <button class="play-btn" onclick="playAudio('Audio7.mp3', this)">Start In Dark</button>
            </div>
        </div>

        <!-- Inflight -->
        <div class="audio-group">
            <div class="group-title">Inflight</div>
            <div class="btn-grid">
                <button class="play-btn" onclick="playAudio('Audio8.mp3', this)">After Fasten Seatbelt Sign Switched Off</button>
            </div>
        </div>

        <!-- Before Landing -->
        <div class="audio-group">
            <div class="group-title">Before Landing</div>
            <div class="btn-grid">
                <button class="play-btn" onclick="playAudio('Audio9.mp3', this)">Top Of Descent</button>
                <button class="play-btn" onclick="playAudio('Audio10.mp3', this)">Final Waste Round</button>
                <button class="play-btn" onclick="playAudio('Audio11.mp3', this)">Fasten Seatbelt</button>
                <button class="play-btn" onclick="playAudio('Audio12.mp3', this)">Arrival Info NRT/KIX</button>
                <button class="play-btn" onclick="playAudio('Audio13.mp3', this)">Arrival Info AMS</button>
                <button class="play-btn" onclick="playAudio('Audio14.mp3', this)">Landing In Dark</button>
            </div>
        </div>

        <!-- After Landing -->
        <div class="audio-group">
            <div class="group-title">After Landing</div>
            <div class="btn-grid">
                <button class="play-btn" onclick="playAudio('Audio15.mp3', this)">Goodbye</button>
            </div>
        </div>

        <!-- Specials -->
        <div class="audio-group">
            <div class="group-title">Specials</div>
            <div class="btn-grid">
                <button class="play-btn" onclick="playAudio('Audio16.mp3', this)">Looking For Medical Doctor</button>
                <button class="play-btn" onclick="playAudio('Audio17.mp3', this)">Turbulence</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="stop-btn" onclick="stopAllAudio()">🛑 STOP ALL</button>
    </div>

    <script>
        let currentAudio = null;
        let currentButton = null;

        function playAudio(fileName, buttonElement) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                if (currentButton) currentButton.classList.remove('playing');
            }

            if (currentButton === buttonElement) {
                currentButton = null;
                currentAudio = null;
                return;
            }

            currentAudio = new Audio(fileName);
            currentButton = buttonElement;

            currentAudio.play().then(() => {
                currentButton.classList.add('playing');
            }).catch(error => {
                alert("Playback Error: The audio file may be missing or named incorrectly.\nFile: " + fileName);
            });

            currentAudio.onended = function() {
                if (currentButton) currentButton.classList.remove('playing');
                currentAudio = null;
                currentButton = null;
            };
        }

        function stopAllAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            if (currentButton) currentButton.classList.remove('playing');
            currentAudio = null;
            currentButton = null;
        }
    </script>
</body>
</html>
